<div class="metabase-container">
  @if (iframeUrl) {
    <iframe
      [src]="iframeUrl"
      title="Metabase Dashboard"
      frameborder="0"
      width="100%"
      height="800"
      allowtransparency>
    </iframe>
  } @else if (error) {
    <div class="error-message">
      <p>Error generating Metabase token:</p>
      <code>{{ error }}</code>
    </div>
  } @else {
    <div class="loading-message">Generating dashboard...</div>
  }
</div>
