<div class="metabase-page">
  <div class="metabase-container">
    @if (isLoading()) {
      <div class="loading-message">
        <div class="spinner"></div>
        <p>Connecting to Metabase...</p>
      </div>
    } @else if (error()) {
      <div class="error-message">
        <p>Unable to open Metabase.</p>
        <code>{{ error() }}</code>
        <button (click)="connectToMetabase()">Retry</button>
      </div>
    }
  </div>
</div>
