<div class="breadcrumb-wrapper mb-2">
  <p-breadcrumb [model]="items" [home]="home" class="w-100"></p-breadcrumb>
</div>

@if (isDownloading) {
<app-loader></app-loader>
}

<div class="card p-3 mb-3 shadow-sm">
  <form class="row g-3 align-items-end">
    <div class="col-md-4">
      <p-floatlabel variant="on" class="w-100">
        <p-select
          [options]="templateOptions"
          optionLabel="label"
          optionValue="value"
          [(ngModel)]="selectedTemplate"
          name="template"
          [filter]="true"
          filterBy="label"
          [showClear]="true"
          (onChange)="onTemplateChange()"
          class="w-100"
        ></p-select>
        <label>Select Template <span class="text-danger">*</span></label>
      </p-floatlabel>
    </div>

    @if (shouldShowGeoFields) {
    <div class="col-md-2">
      <p-floatlabel variant="on" class="w-100">
        <p-select
          [options]="states"
          optionLabel="name"
          optionValue="id"
          [(ngModel)]="selectedState"
          name="stateId"
          [filter]="true"
          filterBy="name"
          [loading]="isLoadingStates"
          [showClear]="true"
          (onChange)="onStateChange()"
          class="w-100"
        ></p-select>
        <label>State</label>
      </p-floatlabel>
    </div>

    <div class="col-md-2">
      <p-floatlabel variant="on" class="w-100">
        <p-select
          [options]="counties"
          optionLabel="name"
          optionValue="id"
          [(ngModel)]="selectedCounty"
          name="countyId"
          [filter]="true"
          filterBy="name"
          [loading]="isLoadingCounties"
          [showClear]="true"
          [disabled]="!selectedState"
          (onChange)="onCountyChange()"
          class="w-100"
        ></p-select>
        <label>County</label>
      </p-floatlabel>
    </div>

    <div class="col-md-2">
      <p-floatlabel variant="on" class="w-100">
        <p-select
          [options]="payams"
          optionLabel="name"
          optionValue="id"
          [(ngModel)]="selectedPayam"
          name="payamId"
          [filter]="true"
          filterBy="name"
          [loading]="isLoadingPayams"
          [showClear]="true"
          [disabled]="!selectedCounty"
          (onChange)="onPayamChange()"
          class="w-100"
        ></p-select>
        <label>Payam</label>
      </p-floatlabel>
    </div>

    <div class="col-md-2">
      <p-floatlabel variant="on" class="w-100">
        <p-select
          [options]="bomas"
          optionLabel="name"
          optionValue="id"
          [(ngModel)]="selectedBoma"
          name="bomaId"
          [filter]="true"
          filterBy="name"
          [loading]="isLoadingBomas"
          [showClear]="true"
          [disabled]="!selectedPayam"
          class="w-100"
        ></p-select>
        <label>Boma</label>
      </p-floatlabel>
    </div>
    }

    @if (shouldShowTrainingDate) {
    <div class="col-md-3">
      <p-floatlabel variant="on" class="w-100">
        <p-datepicker
          [(ngModel)]="selectedTrainingDate"
          name="trainingDate"
          dateFormat="yy-mm-dd"
          [showIcon]="true"
          class="w-100"
        ></p-datepicker>
        <label>Training Date <span class="text-danger">*</span></label>
      </p-floatlabel>
    </div>
    }

    <div class="col-12">
      <div class="d-flex justify-content-end gap-2">
        <p-button
          label="Reset"
          icon="fas fa-refresh"
          severity="danger"
          size="small"
          outlined="true"
          (onClick)="resetFilters()"
        ></p-button>
        <p-button
          label="Download"
          icon="fas fa-download"
          severity="primary"
          size="small"
          [loading]="isDownloading"
          [disabled]="!canDownloadTemplate"
          (onClick)="downloadTemplate()"
        ></p-button>
      </div>
    </div>
  </form>
</div>

<p-toast position="bottom-right"></p-toast>
