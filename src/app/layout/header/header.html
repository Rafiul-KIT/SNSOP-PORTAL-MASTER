
<div class="header">

  @if (isPortalsPage) {
    <div class="portals" (click)="showPortalOptions = !showPortalOptions">
      <i class="fas fa-braille hand"></i>
      <div><small>Portal</small><span class="name">Admin</span></div>
     <i class="fas fa-angle-{{ showPortalOptions ? 'down' : 'right' }} hand"></i>
      <span class="vertical-line"></span>
    </div>
  }
  <div class="portals-option-wrapper {{ showPortalOptions ? 'show' : '' }}" (mouseleave)="showPortalOptions = false">
    <div class="portal-items">
      @for (portal of portalList; track portal) {
        @if (portal.command) {
          <a class="item" (click)="portal.command(); $event.preventDefault()" href="#">
            <i class="{{ portal.icon }} w-50"></i>
            <span>{{ portal.label }}</span>
          </a>
        } @else {
          <a class="item" [href]="portal.link">
            <i class="{{ portal.icon }} w-50"></i>
            <span>{{ portal.label }}</span>
          </a>
        }
      }
    </div>
  </div>
   <!--@if(menuList && menuList.length > 0){
  <div class="menues">
    @for(menu of menuList; track menu){
    <p-button
      label="{{ menu.label }}"
      variant="text"
      [icon]="menu.icon"
      severity="secondary"
      [routerLink]="menu.routerLink"
    />
    }
  </div>
  }-->

  <div class="menues">
    <p-menubar [model]="menuList"></p-menubar>
  </div>

  <!-- Logged In User -->
  @if(userInfo){
  <p-button
    [text]="true"
    icon="fas fa-user-circle fa-lg"
    severity="info"
    (onClick)="showUsermenu = !showUsermenu"
  ></p-button>

  <div
    class="user-menu {{ showUsermenu ? 'show' : '' }}">
    <div class="item" (click)="goToProfile()">
      <i class="fas fa-user me-2"></i>
      Profile ({{userInfo.sub}})
    </div>
    <div class="item" (click)="logout()">
      <i class="fas fa-sign-out-alt me-2"></i>
      Logout
    </div>
  </div>
  }

</div>
