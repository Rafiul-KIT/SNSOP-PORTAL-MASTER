<div class="breadcrumb-wrapper">
    <p-breadcrumb [model]="items" [home]="home"></p-breadcrumb>
</div>

<div class="d-flex me-2">
        <button class="btn btn-warning btn-sm rounded-0 me-2" (click)="linkRoleModal()">
            <i class="fas fa-id-card-clip me-2"></i>
            Link Role
        </button>
        <button class="btn btn-success btn-sm rounded-0" (click)="manageRoleModal(null)">
            <i class="fas fa-user-check me-2"></i>
            Add New Role
        </button>
    </div>


@if (isLoading) {
<app-loader></app-loader>
} @else {

<div class="mt-1 wrapper-scroller">
    <div class="card p-2 mb-2">
        <div class="row">
            <ng-container novalidate [formGroup]="criteriaForm">
                <div class="col-12 col-md-4 col-lg-3">
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="name" placeholder="User Role Name"
                            formControlName="name">
                        <label for="name">Role Name</label>
                    </div>
                </div>
                <div class="col-12 col-md-4 col-lg-9">
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="description" placeholder="User Role Description"
                            formControlName="description">
                        <label for="description">Role Description</label>
                    </div>
                </div>
            </ng-container>
        </div>
        <div class="row">
            <div class="col-12 text-end">
                <!-- <button class="btn btn-link btn-sm me-2" type="button" (click)="showHideAdvanceFilter()">
                        <i class="fas fa-filter me-2"></i>
                        {{showAdvanceFilter ? 'Basic Filter':'Advance Filter'}}
                    </button> -->
                <button class="btn btn-danger btn-sm me-2" (click)="criteriaForm.reset();submitSearchForm()">
                    <i class="fas fa-times me-2"></i>Reset
                </button>
                <button class="btn btn-primary btn-sm" (click)="submitSearchForm()">
                    <i class="fas fa-search me-2"></i>Search
                </button>
            </div>
        </div>
    </div>
    <!-- [scrollable]="true" scrollHeight="60vh" -->
    <p-table [value]="userRoleList" [tableStyle]="{ 'width': '100%' }" [loading]="isLoading">
        <ng-template pTemplate="header">
            <tr>
                <th width="60">Serial</th>
                <th pSortableColumn="name" width="150">
                    Role Name <p-sortIcon field="name"></p-sortIcon>
                </th>
                <th pSortableColumn="description" width="190">
                    Role Description <p-sortIcon field="description"></p-sortIcon>
                </th>
                <th width="30px" class="text-center">Action</th>
            </tr>
        </ng-template>

        <ng-template pTemplate="body" let-role let-rowIndex="rowIndex">
            <tr>
                <td>{{ (searchForm.value.first || 0) + rowIndex + 1 }}</td> <!-- Adjust the index with page offset -->
                <td>{{ role.name }}</td>
                <td>{{ role.description || '—' }}</td>
                <td class="text-center">
                    <i class="fas fa-pencil hand text-primary" (click)="manageRoleModal(role)"></i>
                </td>
            </tr>
        </ng-template>

        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="3" class="text-center">No User Role Found.</td>
            </tr>
        </ng-template>
    </p-table>



    <!-- <p-paginator class="w-100" (onPageChange)="pageChange($event)" [first]="searchForm.value.first"
        [rows]="searchForm.value.size" [totalRecords]="total" [rowsPerPageOptions]="rowsPerPage">
    </p-paginator> -->

</div>
}
