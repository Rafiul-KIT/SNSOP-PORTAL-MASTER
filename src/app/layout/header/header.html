

<div class="header">
  @if(isLandingPage){
      <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #0C5358; width: 100%; height:130px;">

      <div class="container d-flex justify-content-between align-items-center">
      <a class="navbar-brand fw-bold text-white d-flex align-items-center" href="#">
        <div class="d-flex align-items-center mt-4">

          <img src="SNSOP_logo.png" alt="SNSOP Logo" class="me-2" style="height: 30px; width: auto;" />

          <span class="fw-bold">Safety Net for Socioeconomic Opportunities Project</span>
        </div>
      </a>
      <div>
        <button class="btn mt-4 btn-primary fw-bold" [disabled]="isLoading" (click)="loginWithAzureAD()">
          <i class="fas fa-sign-in-alt me-2"></i>
          {{ isLoading ? 'Logging in...' : 'MIS Login' }}
        </button>
      </div>

    </div>

  </nav>

  } @else {
  @if (isPortalsPage) {
  <div class="portals" (click)="showPortalOptions = !showPortalOptions">
    &nbsp;<i class="fas fa-braille hand"></i>
    <div>
     <strong><h3 class="name">SNSOP</h3>
     <span>Home</span></strong>
    </div>
    <i class="fas fa-angle-{{ showPortalOptions ? 'down' : 'right' }} hand"></i>
    <span class="vertical-line"></span>
  </div>
  }
  <div class="portals-option-wrapper {{ showPortalOptions ? 'show' : '' }}" (mouseleave)="showPortalOptions = false">
    <div class="portal-items">
      @for (portal of portalList; track portal) {
        @if (portal.command) {
          <a class="item" (click)="portal.command(); $event.preventDefault()" href="#">
            <i class="{{ portal.icon }} w-50"></i>
            <span>{{ portal.label }}</span>
          </a>
        } @else {
          <a class="item" [href]="portal.link">
            <i class="{{ portal.icon }} w-50"></i>
            <span>{{ portal.label }}</span>
          </a>
        }
      }
    </div>
  </div>
   <!--@if(menuList && menuList.length > 0){
  <div class="menues">
    @for(menu of menuList; track menu){
    <p-button
      label="{{ menu.label }}"
      variant="text"
      [icon]="menu.icon"
      severity="secondary"
      [routerLink]="menu.routerLink"
    />
    }
  </div>
  }-->

  <div class="menues">
    <p-menubar [model]="menuList"></p-menubar>
  </div>

  <!-- Logged In User -->
  @if(userInfo){
  <p-button
    [text]="true"
    icon="fas fa-user-circle fa-lg"
    severity="info"
    (onClick)="showUsermenu = !showUsermenu"
  ></p-button>

  <div
    class="user-menu {{ showUsermenu ? 'show' : '' }}" (mouseleave)="showUsermenu = false">
    <div class="item" (click)="goToProfile()">
      <i class="fas fa-user me-2"></i>
      Profile
    </div>
    <div class="item" (click)="logout()">
      <i class="fas fa-sign-out-alt me-2"></i>
      Logout
    </div>
  </div>
  }
}
</div>
