
<div class="card mt-2 p-3 shadow-sm">
  <div class="d-flex justify-content-between align-items-center">
    <h5 class="mb-0">Link User Role</h5>
    <button type="button" class="btn-close" (click)="closeDialog()" aria-label="Close"></button>
  </div>
  <hr/>
  @if (isLoading) {
    <div tabindex="0" role="alert" aria-busy="true">
      <app-loader></app-loader>
    </div>
  } @else {
    <div class="row" [formGroup]="roleLinkForm">
      <!-- User Dropdown -->
      <div class="col-12 col-md-6">
        <div class="mb-3">
          <label for="userId" class="fw-bold d-block mb-1">User</label>
          <select
            id="userId"
            class="form-select"
            #userSel
            (change)="getUserDetail(userSel.value)"
            formControlName="userId"
          >
            <option value="">Select User</option>
            @for (user of userList; track user.id) {
              <option [value]="user.id">
                {{ user.fullName }} ({{ user.email }})
              </option>
            }
          </select>
        </div>
      </div>

      <!-- Role Dropdown -->
      <div class="col-12 col-md-6">
        <div class="mb-3">
          <label for="roleId" class="fw-bold d-block mb-1">Role</label>
          <select
            id="roleId"
            class="form-select"
            #roleSel
            (change)="getRoleDetail(roleSel.value)"
            formControlName="roleId"
          >
            <option value="">Select Role</option>
            @for (role of roleList; track role.id) {
              <option [value]="role.id">
                {{ role.roleName }}
              </option>
            }
          </select>
        </div>
      </div>
      <!-- Submit -->
      <div class="col-12 text-end">
        <button
          class="btn btn-success btn-sm rounded-0"
          (click)="roleLinkFormHandler()"
        >
          <i class="fas fa-lock me-2"></i>
          Link Role to User
        </button>
      </div>
    </div>
  }
  
</div>
