<div class="metabase-page">
  <div class="dashboard-selector">
    <button 
      *ngFor="let dash of dashboards" 
      (click)="loadDashboard(dash.id)"
      [class.active]="currentDashboardId === dash.id"
      [disabled]="isLoading">
      {{ dash.name }}
    </button>
  </div>

  <div class="metabase-container">
    @if (isLoading) {
      <div class="loading-message">
        <div class="spinner"></div>
        <p>Loading {{ currentDashboardName }}...</p>
      </div>
    } @else if (iframeUrl) {
      <iframe
        [src]="iframeUrl"
        title="Metabase Dashboard"
        frameborder="0"
        width="100%"
        height="800"
        allowtransparency>
      </iframe>
    } @else if (error) {
      <div class="error-message">
        <p>Error loading dashboard:</p>
        <code>{{ error }}</code>
        @if (currentDashboardId !== null) {
          <button (click)="loadDashboard(currentDashboardId)">Retry</button>
        } @else {
          <button (click)="fetchDashboards()">Retry</button>
        }
      </div>
    } @else if (!dashboards.length) {
      <div class="error-message">
        <p>No dashboards found.</p>
        <button (click)="fetchDashboards()">Retry</button>
      </div>
    }
  </div>
</div>
