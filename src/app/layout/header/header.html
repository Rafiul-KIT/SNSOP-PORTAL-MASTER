
<div class="header">

  <div class="portals" (click)="showPortalOptions = !showPortalOptions">
    <img src="SNSOP_logo.png" style="height: 30px; width: auto;" /> &nbsp;&nbsp;&nbsp;
    <i class="fas fa-braille hand"></i>
    <div><small>Portal</small><span class="name">Admin</span></div>
    <!-- <i class="fas fa-angle-down hand"></i> -->
    <span class="vertical-line"></span>
  </div>
   @if(menuList && menuList.length > 0){
  <div class="menues">
    @for(menu of menuList; track menu){
    <p-button
      label="{{ menu.name }}"
      variant="text"
      [icon]="menu.icon"
      severity="secondary"
      [routerLink]="menu.routerLink"
    />
    }
  </div>
  }

  <!-- Logged In User -->
  @if(userInfo){
  <p-button
    [text]="true"
    icon="fas fa-user-circle fa-lg"
    severity="info"
    (onClick)="showUsermenu = !showUsermenu"
  ></p-button>

  <div
    class="user-menu {{ showUsermenu ? 'show' : '' }}"
    (mouseleave)="showUsermenu = false"
  >
    <div class="item" (click)="goToProfile()">
      <i class="fas fa-user me-2"></i>
      Profile ({{userInfo.sub}})
    </div>
    <div class="item" (click)="logout()">
      <i class="fas fa-sign-out-alt me-2"></i>
      Logout
    </div>
  </div>
  }

</div>
