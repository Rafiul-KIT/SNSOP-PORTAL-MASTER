@if (isLoading) {
<app-loader></app-loader>
} @else {
<div class="breadcrumb-wrapper">
  <p-breadcrumb [model]="breadcrumbItems" [home]="breadcrumbHome" class="w-100"></p-breadcrumb>
</div>

<div class="card p-3 mb-2">
  <form [formGroup]="searchForm" class="row g-3">
    <!-- State -->
    <div class="col-md-3">
      <p-floatlabel variant="on" class="w-100">
        <p-select [options]="states" optionLabel="name" formControlName="state" (onChange)="onStateChange($event)" />
        <label>State Name</label>
      </p-floatlabel>
    </div>

    <!-- County -->
    <div class="col-md-3">
      <p-floatlabel variant="on" class="w-100">
        <p-select [options]="counties" optionLabel="name" formControlName="county" (onChange)="onCountyChange($event)" />
        <label>County Name</label>
      </p-floatlabel>
    </div>
    <!-- Payam -->
    <div class="col-md-3">
      <p-floatlabel variant="on" class="w-100">
        <p-select [options]="payams" optionLabel="name" formControlName="payam" (onChange)="onPayamChange($event)" />
        <label>Payam Name</label>
      </p-floatlabel>
    </div>
    <!-- Boma -->
    <div class="col-md-3">
      <p-floatlabel variant="on" class="w-100">
        <p-select [options]="bomas" optionLabel="name" formControlName="boma" />
        <label>Boma Name</label>
      </p-floatlabel>
    </div>

    <!-- Advanced Search Fields -->
    @if (showAdvancedSearch) {
    <!-- Household Number -->
    <div class="col-md-3">
      <p-floatlabel variant="on" class="w-100">
        <input pInputText formControlName="householdNumber" class="w-100" />
        <label>Household Number</label>
      </p-floatlabel>
    </div>

    <!-- Name -->
    <div class="col-md-3">
      <p-floatlabel variant="on" class="w-100">
        <input pInputText formControlName="name" class="w-100" />
        <label>Name</label>
      </p-floatlabel>
    </div>

    <!-- Mobile Number -->
    <div class="col-md-3">
      <p-floatlabel variant="on" class="w-100">
        <input pInputText formControlName="mobileNumber" class="w-100" />
        <label>Mobile Number</label>
      </p-floatlabel>
    </div>

    <!-- Wallet Number -->
    <div class="col-md-3">
      <p-floatlabel variant="on" class="w-100">
        <input pInputText formControlName="walletNumber" class="w-100" />
        <label>Wallet Number</label>
      </p-floatlabel>
    </div>

    <!-- Support Type -->
    <div class="col-md-3">
      <p-floatlabel variant="on" class="w-100">
        <p-select [options]="supportTypes" optionLabel="name" optionValue="value" formControlName="supportType" />
        <label>Support Type</label>
      </p-floatlabel>
    </div>

    <!-- Registration Phase -->
    <div class="col-md-3">
      <p-floatlabel variant="on" class="w-100">
        <p-select [options]="registrationPhases" optionLabel="name" optionValue="value"
          formControlName="registrationPhase" />
        <label>Registration Phase</label>
      </p-floatlabel>
    </div>
    }

    <div class="col-12">
      <div class="d-grid d-sm-flex justify-content-end align-items-center gap-2">
        <p-button [label]="showAdvancedSearch ? 'Close' : 'Advance Search'" icon="fas fa-filter"
          (onClick)="toggleAdvancedSearch()" severity="warn" size="small" [outlined]="true" size="small">
        </p-button>

        <p-button label="Reset" icon="fas fa-refresh" severity="danger" size="small" [outlined]="true"
          (onClick)="resetForm()">
        </p-button>
      </div>
    </div>

  </form>
</div>

<div class="card p-3">
  <div class="d-flex flex-wrap align-items-center gap-3">
    <div class="d-flex align-items-center gap-2 flex-grow-1">
      <label class="fw-bold">Import CSV:</label>
      <input type="file" #csvUploader class="form-control" (change)="onFileSelect($event)" accept=".csv"
        style="max-width: 300px;" />
      <p-button icon="fas fa-times" (onClick)="clearSelectedFile(true)" [disabled]="!selectedFile" size="small"
        severity="secondary"></p-button>
      <p-button label="Import Data" icon="fas fa-upload" (onClick)='importData()' size="small" severity="primary"
        [disabled]="!selectedFile"></p-button>
    </div>

    <div class="d-flex align-items-center gap-2">
      <p-button label="Download Latest Saved" icon="fas fa-file-download" (onClick)="downloadLatestSaved()" size="small"
        severity="info" class="no-wrap-label" [disabled]="searchForm.invalid"></p-button>
    </div>
  </div>
</div>
}
