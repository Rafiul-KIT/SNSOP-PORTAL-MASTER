@if (isLoading) {
  <app-loader></app-loader>
} @else {
<ng-template #mainContent>
  <div class="mt-1">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-md-5 col-lg-4" [formGroup]="userRoleForm">
          <div class="card mt-2">
            <h5 class="card-header p-3">Basic Information</h5>
            <div class="card-body">
              <div class="mb-3">
                <label for="roleName" class="fw-bold d-block mb-1">Role Name</label>
                <input type="text" formControlName="roleName" minlength="3"
                       class="form-control {{userRoleForm.get('roleName')!.hasError('pattern') || (userRoleForm.value.roleName != '' && userRoleForm.value.roleName!.length < 3) ? 'is-invalid':''}}"
                       id="roleName" placeholder="Enter Role Name">
                <div *ngIf="userRoleForm.get('roleName')!.hasError('pattern')" class="invalid-feedback">
                  Only Characters are allowed!
                </div>
              </div>
              <div class="mb-3">
                <label for="roleDescription" class="fw-bold d-block mb-1">Role Description</label>
                <textarea formControlName="roleDescription" class="form-control" rows="9"
                          id="roleDescription" placeholder="Enter Role Description"></textarea>
              </div>
            </div>
          </div>
        </div>
        <div class="col-12 col-md-7 col-lg-8">
          <div class="card mt-2">
            <h5 class="card-header p-3">Permission List</h5>
            <div class="card-body">
              <div class="d-flex align-items-center gap-1 mb-1"
                   *ngFor="let permission of availabaleRoleList">
                <p-checkbox [value]="permission.value" [ngModel]="permission.checked" [binary]="true"
                            (onChange)="getSelectedPermission($event.checked, permission.value)"
                            inputId="{{permission.value}}_{{permission.id}}"></p-checkbox>
                <label for="{{permission.value}}_{{permission.id}}">{{permission.label}}</label>
              </div>
            </div>
          </div>
        </div>
        <div class="col-12 col-md-12 col-lg-12">
          <div class="card mt-2">
            <div class="card-body text-end" *ngIf="userRoleDetails == null;else profileUpdateFooter">
              <button class="btn btn-success btn-sm rounded-0 me-2" (click)="formHandler(1)"
                      [disabled]="userRoleForm.invalid">
                <i class="fas fa-save me-2"></i>Save &amp; Close
              </button>
              <button class="btn btn-success btn-sm rounded-0" (click)="formHandler(2)"
                      [disabled]="userRoleForm.invalid">
                <i class="fas fa-save me-2"></i>Save &amp; Add New
              </button>
            </div>
            <ng-template #profileUpdateFooter>
              <div class="card-body d-flex justify-content-end">
                <button class="btn btn-success btn-sm rounded-0" (click)="formHandler(null)"
                        [disabled]="userRoleForm.invalid">
                  <i class="fas fa-save me-2"></i>Update
                </button>
              </div>
            </ng-template>
          </div>
        </div>
      </div>
    </div>
  </div>
</ng-template>
}
