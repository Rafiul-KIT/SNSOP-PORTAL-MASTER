<div class="breadcrumb-wrapper mb-2">
  <p-breadcrumb [model]="items" [home]="home" class="w-100"></p-breadcrumb>
</div>

@if (isLoading && !isSearching) {
<app-loader></app-loader>
} @else {

<div class="card p-3 mb-3 shadow-sm">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0 fw-semibold">
      <i class="fas fa-graduation-cap me-2"></i> Course Entry
    </h5>
  </div>

  <form class="row g-3 align-items-end">
    <div class="col-md-6">
      <p-floatlabel variant="on">
        <input
          pInputText
          type="text"
          class="form-control"
          [(ngModel)]="form.courseName"
          name="courseName"
        />
        <label>Course Name *</label>
      </p-floatlabel>
    </div>

    <div class="col-md-6">
      <p-floatlabel variant="on">
        <input
          pInputText
          type="text"
          class="form-control"
          [(ngModel)]="form.courseCode"
          name="courseCode"
        />
        <label>Course Code *</label>
      </p-floatlabel>
    </div>

    <div class="col-12">
      <div class="d-flex justify-content-end gap-2">
        <p-button
          label="Reset"
          icon="fas fa-refresh"
          severity="danger"
          size="small"
          outlined="true"
          (onClick)="resetForm()"
        ></p-button>
        <p-button
          label="Save"
          icon="fas fa-save"
          severity="success"
          size="small"
          [loading]="isSaving"
          (onClick)="saveCourse()"
        ></p-button>
      </div>
    </div>
  </form>
</div>

<div class="card shadow-sm">
  <div class="card-header d-flex justify-content-between align-items-center">
    <h5 class="mb-0 fw-semibold">
      <i class="fas fa-search me-2"></i> Course List
    </h5>
    <div class="d-flex align-items-center gap-2">
      <p class="fw-bold mb-0">
        Showing <kbd>{{ courses.length }}</kbd> of <kbd>{{ totalRecords }}</kbd> records
      </p>
      <p-button
        label="Search"
        icon="fas fa-search"
        severity="primary"
        size="small"
        [loading]="isSearching"
        (onClick)="searchCourses()"
      ></p-button>
    </div>
  </div>

  <p-table
    [value]="courses"
    [scrollHeight]="'60vh'"
    [tableStyle]="{ 'min-width': '100%', 'margin-bottom': '5px' }"
    dataKey="id"
    size="small"
    styleClass="p-datatable-sm p-datatable-gridlines"
  >
    <ng-template pTemplate="header">
      <tr>
        <th>Serial</th>
        <th>ID</th>
        <th>Course Name</th>
        <th>Course Code</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-row let-i="rowIndex">
      <tr>
        <td>{{ (currentPage * pageSize) + i + 1 }}</td>
        <td>{{ row.id }}</td>
        <td>{{ row.courseName || '--' }}</td>
        <td>{{ row.courseCode || '--' }}</td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="4" class="text-center text-danger">
          <b>No records found!</b>
        </td>
      </tr>
    </ng-template>
  </p-table>

  <div class="border-top">
    <p-paginator
      class="paginator-sticky"
      [rows]="pageSize"
      [totalRecords]="totalRecords"
      [rowsPerPageOptions]="[10, 25, 50]"
      [first]="currentPage * pageSize"
      (onPageChange)="onPageChange($event)"
      currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
    ></p-paginator>
  </div>
</div>

}

<p-toast position="bottom-right"></p-toast>
