<div class="home">
  <div class="header">
    <h4 class="brand">
      <img src="SNSOP_logo.png" height="30px" alt="" />
    </h4>
  </div>

  <div class="wrapper">
    <!-- Loader component shown when loading is true, it will overlay on the card -->
    @if (isLoading) { <app-loader></app-loader> }
    @else {
    <p-card class="text-center">
      <ng-template pTemplate="content">
        <form>
          <h1 class="m-0">Login</h1>
          <p class="text-600 mt-2">Sign In with your Microsoft account</p>
          <div class="grid mt-3">
            <div class="col-12">
              <p-button styleClass="w-full" icon="fas fa-sign-in" [loading]="isLoading" (onClick)="loginWithAzureAD()"
                [label]="isLoading ? 'Logging in...' : 'Login with Microsoft Azure AD'">
              </p-button>
            </div>
          </div>
        </form>
      </ng-template>
    </p-card>
    }
  </div>
</div>
